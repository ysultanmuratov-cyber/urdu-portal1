<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrDU | Talaba Portali</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#f8fafc] min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-[420px] bg-white rounded-[2.5rem] shadow-[0_20px_50px_rgba(37,99,235,0.1)] p-10 border border-white">
        
        <div class="flex flex-col items-center mb-10 text-center">
            <div class="w-20 h-20 bg-blue-600 rounded-[22px] flex items-center justify-center mb-6 shadow-xl shadow-blue-200 transform hover:rotate-6 transition-all duration-300">
                <span class="text-white font-black text-2xl italic tracking-tighter">UrDU</span>
            </div>
            <h1 class="text-3xl font-[800] text-slate-800 tracking-tight leading-none">Talaba Portali</h1>
            <p class="text-blue-600 text-[10px] font-bold uppercase tracking-[0.3em] mt-3">Urganch Davlat Universiteti</p>
        </div>

        <div class="space-y-4">
            <input type="text" placeholder="Login / Talaba ID" class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition-all font-medium text-slate-700">
            <input type="password" placeholder="Parol" class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition-all font-medium text-slate-700">
            
            <button class="w-full py-4 bg-blue-600 text-white font-black rounded-2xl shadow-lg shadow-blue-500/30 hover:bg-blue-700 transition-all active:scale-95 duration-200 mt-2">
                TIZIMGA KIRISH
            </button>
        </div>

        <div class="mt-12 text-center border-t border-slate-50 pt-8">
            <p class="text-slate-400 text-[9px] font-bold uppercase tracking-[0.4em]">
                Developed by Murat Sultanov
            </p>
        </div>
    </div>
</body>
</html>

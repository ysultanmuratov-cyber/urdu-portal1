<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UrDU - Talaba Portali</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6 font-sans">

  <div class="w-full max-w-[400px] bg-white rounded-[2.5rem] shadow-2xl p-10 border border-slate-100">
    <!-- Logo ve Başlık -->
    <div class="flex flex-col items-center mb-10 text-center">
      <div class="w-20 h-20 bg-blue-600 rounded-3xl flex items-center justify-center mb-6 shadow-xl shadow-blue-200">
        <span class="text-white font-black text-2xl italic tracking-tighter">UrDU</span>
      </div>
      <h1 class="text-3xl font-black text-slate-800 tracking-tight leading-none">Talaba Portali</h1>
      <p class="text-blue-600 text-[10px] font-bold uppercase tracking-[0.3em] mt-3">Urganch Davlat Universiteti</p>
    </div>

    <!-- Giriş Formu -->
    <div class="space-y-4">
      <input type="text" placeholder="Login / Talaba ID" class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition-all font-medium text-slate-700" />
      <input type="password" placeholder="Parol" class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition-all font-medium text-slate-700" />
      <button class="w-full py-4 bg-blue-600 text-white font-black rounded-2xl shadow-lg hover:bg-blue-700 transition-all active:scale-95 duration-200 mt-2">
        TIZIMGA KIRISH
      </button>
    </div>

    <!-- Alt Bilgi -->
    <div class="mt-12 text-center border-t border-slate-50 pt-8">
      <p class="text-slate-400 text-[9px] font-bold uppercase tracking-[0.4em]">
        Developed by Murat Sultanov
      </p>
    </div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="uz" class="h-full bg-slate-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UrDU - Talaba Portali</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="h-full flex items-center justify-center p-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-800 via-slate-900 to-black text-slate-100">

  <!-- Главная карточка -->
  <div class="w-full max-w-md bg-slate-800/60 backdrop-blur-xl border border-slate-700/50 rounded-3xl p-8 sm:p-10 shadow-2xl relative overflow-hidden">
    
    <!-- Эффекты подсветки фона -->
    <div class="absolute -top-24 -right-24 w-48 h-48 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Заголовок -->
    <div class="flex flex-col items-center text-center mb-8 relative z-10">
      <div class="w-20 h-20 bg-gradient-to-tr from-blue-600 to-indigo-500 rounded-2xl flex flex-col items-center justify-center mb-5 shadow-lg shadow-blue-500/30 transform hover:scale-105 transition-all duration-300 border border-blue-400/30">
        <span class="text-white font-black text-2xl italic tracking-tighter leading-none">UrDU</span>
        <span class="text-[8px] text-blue-200 font-bold uppercase tracking-widest mt-1">PORTAL</span>
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Talaba Portali</h1>
      <p class="text-blue-400 text-xs font-semibold uppercase tracking-[0.2em] mt-2">
        Urganch Davlat Universiteti
      </p>
    </div>

    <!-- Блок уведомлений (ошибка / успех) -->
    <div id="alertMessage" class="hidden mb-5 p-3.5 rounded-xl text-xs font-medium border text-center transition-all duration-300 relative z-10"></div>

    <!-- Форма -->
    <form id="loginForm" class="space-y-5 relative z-10" onsubmit="handleLogin(event)">
      
      <!-- Логин -->
      <div class="space-y-1.5">
        <label class="text-xs font-medium text-slate-300 ml-1">Login / Talaba ID</label>
        <div class="relative flex items-center">
          <i data-lucide="user" class="w-5 h-5 absolute left-4 text-slate-400 pointer-events-none"></i>
          <input 
            id="loginInput"
            type="text" 
            placeholder="Loginni kiriting" 
            required
            class="w-full pl-12 pr-4 py-3.5 bg-slate-900/60 border border-slate-700 rounded-xl outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 text-slate-100 placeholder:text-slate-500 text-sm font-medium transition-all"
          />
        </div>
      </div>

      <!-- Пароль -->
      <div class="space-y-1.5">
        <label class="text-xs font-medium text-slate-300 ml-1">Parol</label>
        <div class="relative flex items-center">
          <i data-lucide="lock" class="w-5 h-5 absolute left-4 text-slate-400 pointer-events-none"></i>
          <input 
            id="passwordInput"
            type="password" 
            placeholder="••••••••" 
            required
            class="w-full pl-12 pr-12 py-3.5 bg-slate-900/60 border border-slate-700 rounded-xl outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 text-slate-100 placeholder:text-slate-500 text-sm font-medium transition-all"
          />
          <button 
            type="button" 
            onclick="togglePassword()"
            class="absolute right-4 text-slate-400 hover:text-slate-200 focus:outline-none"
          >
            <i id="eyeIcon" data-lucide="eye" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <!-- Запомнить меня -->
      <div class="flex items-center justify-between pt-1">
        <label class="flex items-center space-x-2.5 cursor-pointer group">
          <input type="checkbox" class="w-4 h-4 rounded border-slate-700 bg-slate-900 text-blue-600 focus:ring-blue-500/20 focus:ring-offset-slate-900">
          <span class="text-xs text-slate-300 group-hover:text-slate-100 transition-colors">Eslab qolish</span>
        </label>
      </div>

      <!-- Кнопка входа -->
      <button 
        type="submit" 
        class="w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold text-sm rounded-xl shadow-lg shadow-blue-600/25 active:scale-[0.98] transition-all duration-200 mt-2 flex items-center justify-center space-x-2"
      >
        <span>TIZIMGA KIRISH</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>

    </form>

    <!-- Авторство -->
    <div class="mt-8 pt-6 border-t border-slate-700/50 text-center relative z-10">
      <p class="text-slate-500 text-[10px] font-bold uppercase tracking-[0.2em]">
        Developed by <span class="text-slate-400">Murat Sultanov</span>
      </p>
    </div>

  </div>

  <script>
    lucide.createIcons();

    // Показать/скрыть пароль
    function togglePassword() {
      const input = document.getElementById('passwordInput');
      const eyeIcon = document.getElementById('eyeIcon');
      
      if (input.type === 'password') {
        input.type = 'text';
        eyeIcon.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        eyeIcon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    // Проверка логина и пароля
    function handleLogin(event) {
      event.preventDefault();

      const loginInput = document.getElementById('loginInput').value.trim();
      const passwordInput = document.getElementById('passwordInput').value.trim();
      const alertMessage = document.getElementById('alertMessage');

      // 🔑 Установленные данные:
      const correctLogin = "Murat";
      const correctPassword = "Sultanov06";

      if (loginInput === correctLogin && passwordInput === correctPassword) {
        // Успешный вход
        alertMessage.className = "mb-5 p-3.5 rounded-xl text-xs font-medium border text-center transition-all duration-300 relative z-10 bg-emerald-500/10 border-emerald-500/30 text-emerald-400";
        alertMessage.innerText = "Tizimga muvaffaqiyatli kirildi! Yönlendirilmoqdasiz...";
        alertMessage.classList.remove('hidden');

        setTimeout(() => {
          // Перенаправление после успешного входа:
          window.location.href = "https://student.urdu.uz";
        }, 1200);

      } else {
        // Ошибка
        alertMessage.className = "mb-5 p-3.5 rounded-xl text-xs font-medium border text-center transition-all duration-300 relative z-10 bg-rose-500/10 border-rose-500/30 text-rose-400";
        alertMessage.innerText = "Login yoki parol noto'g'ri!";
        alertMessage.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
